name: p04_forms_and_local_storage
description: >
  P04 — Forms & Local Storage.
  TextFormField validation, SharedPreferences, Hive NoSQL storage.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  # SharedPreferences — simple key-value storage
  shared_preferences: ^2.2.2
  # Hive — fast, lightweight NoSQL for Flutter
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Hive type adapter generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
