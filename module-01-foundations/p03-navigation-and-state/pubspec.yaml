name: p03_navigation_and_state
description: >
  P03 — Navigation & State Management.
  GoRouter for navigation, Riverpod for state management,
  FutureProvider, StateProvider, and ChangeNotifier patterns.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # GoRouter — the modern, URL-based router for Flutter
  go_router: ^13.0.0
  # Riverpod — reactive state management
  flutter_riverpod: ^2.5.1
  # Riverpod annotation for code generation (optional but recommended)
  riverpod_annotation: ^2.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Code generator for Riverpod annotations
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
