name: p02_flutter_fundamentals
description: >
  P02 — Flutter Fundamentals.
  First Flutter app covering: widget tree, StatelessWidget,
  StatefulWidget, Text, Image, Container, ListView, Scaffold,
  AppBar, and ThemeData.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
