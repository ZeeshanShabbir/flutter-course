name: p13_capstone
description: >
  P13 — Capstone: Plan & Build.
  
  A complete, production-quality Flutter app combining
  everything from the course:
  - Firebase Auth (email + Google) 
  - Firestore real-time CRUD
  - Riverpod state management
  - GoRouter with auth guard
  - Push notifications (FCM)
  - Local storage (Hive) for offline support
  - AI-powered features (OpenAI task suggestions)
  - Image picker (profile photo → Firebase Storage)
  - Full test coverage
  - Dark mode, responsive design
  - Crashlytics + Analytics
  
  Slide reference: "Capstone Definition of Done" checklist.
  Students build this over Weeks 10-11.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Code generation models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.20
  firebase_crashlytics: ^3.4.15
  firebase_analytics: ^10.8.5
  google_sign_in: ^6.2.1

  # HTTP
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local storage
  hive_flutter: ^1.1.0

  # UI packages
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.1.2
  lottie: ^3.1.0
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
