name: p06_firebase_fullstack
description: >
  P06 — Firebase Full-Stack.
  Firebase Auth (email + Google + phone OTP), Firestore CRUD
  with real-time listeners, Storage file upload, Security Rules,
  Firebase Analytics, and Crashlytics.
  
  SETUP REQUIRED before running:
  1. Create a Firebase project at console.firebase.google.com
  2. Run: flutterfire configure
  3. Enable Email/Password and Google auth in Firebase console
  4. Create a Firestore database in test mode
  5. Enable Firebase Storage

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0

  # Firebase core — always required
  firebase_core: ^2.27.0

  # Authentication
  firebase_auth: ^4.17.4
  google_sign_in: ^6.2.1

  # Firestore real-time database
  cloud_firestore: ^4.15.4

  # Storage (images, files)
  firebase_storage: ^11.6.5

  # Push notifications
  firebase_messaging: ^14.7.20

  # Crash reporting
  firebase_crashlytics: ^3.4.15

  # Analytics
  firebase_analytics: ^10.8.5

  # Helpers
  image_picker: ^1.0.7
  uuid: ^4.3.3
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
