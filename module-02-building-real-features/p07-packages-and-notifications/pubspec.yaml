name: p07_packages_and_notifications
description: >
  P07 — Packages, Plugins & Push Notifications.
  image_picker, geolocator, url_launcher, share_plus,
  Firebase Cloud Messaging (FCM), local notifications,
  deep linking, and permission handling.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1

  # Packages (P07 slide: "Essentials")
  image_picker: ^1.0.7        # camera + gallery access
  geolocator: ^11.0.0         # GPS location
  url_launcher: ^6.2.5        # open URLs, email, phone
  share_plus: ^7.2.2          # share content to other apps
  permission_handler: ^11.3.0 # request/check permissions

  # Push Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.20
  flutter_local_notifications: ^17.1.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
