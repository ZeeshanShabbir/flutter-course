name: p08_mini_project
description: >
  P08 — Mini-Project: Task Manager App
  
  A COMPLETE production-quality app covering:
  - Authentication (Firebase Auth — email + Google)
  - Firestore CRUD (tasks with real-time updates)
  - REST API integration (JSONPlaceholder for todos)
  - State management (Riverpod)
  - Navigation (GoRouter with auth guard)
  - Local storage (Hive for offline cache)
  - Push notifications (FCM)
  - Image picker (profile photo)
  - Error handling, loading states, empty states
  
  This is the P08 capstone deliverable. Students build this
  over Week 6 combining everything from P01–P07.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # HTTP / REST
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.20
  firebase_crashlytics: ^3.4.15
  firebase_analytics: ^10.8.5

  # Local Storage
  hive_flutter: ^1.1.0

  # Code generation helpers
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Packages (P07)
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  permission_handler: ^11.3.0

  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
