name: p10_testing_and_crash_reporting
description: >
  P10 — Testing & Crash Reporting.
  Unit tests, widget tests, integration tests, mockito/mocktail,
  Firebase Crashlytics, Firebase Analytics.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^2.27.0
  firebase_crashlytics: ^3.4.15
  firebase_analytics: ^10.8.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Mocking frameworks
  mockito: ^5.4.4
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
